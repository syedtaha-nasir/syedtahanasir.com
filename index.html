<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Head Component Test</title>

    <script>
        document.addEventListener('DOMContentLoaded', async function () {

            try {

                const response = await fetch('/components/head.html');

                if (!response.ok) {
                    throw new Error(
                        'Could not load /components/head.html — Status: ' +
                        response.status
                    );
                }

                const html = await response.text();

                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');

                Array.from(doc.head.children).forEach(function (element) {

                    document.head.appendChild(
                        element.cloneNode(true)
                    );

                });

                console.log('head.html injected successfully.');

            } catch (error) {

                console.error('Head component error:', error);

            }

        });
    </script>

</head>

<body>

    <main style="padding: 100px 24px;">

        <h1>Head Component Test</h1>

        <p>
            This page is testing only the shared head component.
        </p>

    </main>

</body>

</html>
